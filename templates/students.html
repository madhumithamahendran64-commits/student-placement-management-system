<!DOCTYPE html>
<html>

<head>
    <title>Students</title>
</head>

<body>

    <h1>Student Placement Management System</h1>

    <h2>Student List</h2>

    <table border="1">

        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Email</th>
            <th>Department</th>
            <th>CGPA</th>
            <th>Skills</th>
        </tr>

        {% for student in students %}

        <tr>
            <td>{{ student["student_id"] }}</td>
            <td>{{ student["name"] }}</td>
            <td>{{ student["email"] }}</td>
            <td>{{ student["department"] }}</td>
            <td>{{ student["cgpa"] }}</td>
            <td>{{ student["skills"] }}</td>
        </tr>

        {% endfor %}

    </table>

</body>

</html>
