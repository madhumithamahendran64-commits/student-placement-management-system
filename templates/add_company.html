<!DOCTYPE html>
<html>

<head>
    <title>Add Company</title>
</head>

<body>

    <h1>Student Placement Management System</h1>

    <h2>Add Company</h2>

    <form method="POST">

        <label>Company Name:</label>
        <input type="text" name="company_name" required>

        <br><br>

        <label>Job Role:</label>
        <input type="text" name="job_role" required>

        <br><br>

        <label>Location:</label>
        <input type="text" name="location" required>

        <br><br>

        <label>Salary (LPA):</label>
        <input type="number" name="salary" step="0.1" min="0" required>

        <br><br>

        <label>Minimum CGPA:</label>
        <input type="number" name="min_cgpa" step="0.01" min="0" max="10" required>

        <br><br>

        <label>Required Skills:</label>
        <input type="text" name="required_skills" required>

        <br><br>

        <button type="submit">Add Company</button>

    </form>

</body>

</html>
